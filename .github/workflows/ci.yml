name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Server npm audit
        run: npm audit --audit-level=high

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Gated at "critical" rather than "high": the client currently carries
      # one known, accepted high-severity finding (a Vite dev-server-only
      # path-traversal advisory — irrelevant to the production build, fixing
      # it needs a breaking Vite major bump). See CLAUDE.md → "Security
      # Hardening" for the full reasoning. Revisit if a real fix lands.
      - name: Client npm audit
        working-directory: client
        run: npm audit --audit-level=critical

      - name: Build client
        working-directory: client
        run: npm run build
