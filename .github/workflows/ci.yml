name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the `smoke` job be triggered manually from the Actions tab against
  # any deployed URL (e.g. right after a Railway deploy) — see Launch
  # Checklist Stage 3/4 in the Obsidian vault. Defaults to production.
  workflow_dispatch:
    inputs:
      smoke_target:
        description: "Base URL to smoke-test"
        required: false
        default: "https://www.graspr.in"

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Server npm audit
        run: npm audit --audit-level=high

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Gated at "critical" rather than "high": the client currently carries
      # one known, accepted high-severity finding (a Vite dev-server-only
      # path-traversal advisory — irrelevant to the production build, fixing
      # it needs a breaking Vite major bump). See CLAUDE.md → "Security
      # Hardening" for the full reasoning. Revisit if a real fix lands.
      - name: Client npm audit
        working-directory: client
        run: npm audit --audit-level=critical

      - name: Build client
        working-directory: client
        run: npm run build

  # Runs the API test suite (tests/api) against a real ephemeral Postgres +
  # a real booted server — same code path as local dev, not mocked. Every
  # test file self-skips its DB-dependent checks if DATABASE_URL is absent
  # (see tests/support/db.js), so this job exercises the FULL suite; the
  # separate `smoke` job below runs the same command against the deployed
  # site with no DB access, which naturally narrows to the safe subset.
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graspr
          POSTGRES_PASSWORD: graspr
          POSTGRES_DB: graspr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://graspr:graspr@localhost:5432/graspr_ci
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: development
      PORT: 3001
      BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Boot the server in the background
        # server/db.js self-migrates (CREATE TABLE IF NOT EXISTS) on boot —
        # no separate migration step needed against a fresh CI database.
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health || (echo "server did not become healthy in time" && exit 1)

      - name: Run API test suite
        run: npm test

  # Same server/DB setup as api-tests, plus the built client served via Vite
  # preview, so E2E drives the actual production bundle, not the dev server.
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graspr
          POSTGRES_PASSWORD: graspr
          POSTGRES_DB: graspr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://graspr:graspr@localhost:5432/graspr_ci
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      NODE_ENV: development
      PORT: 3001
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Boot the API server in the background
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health || (echo "server did not become healthy in time" && exit 1)

      - name: Serve the built client in the background
        working-directory: client
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 && break
            sleep 1
          done
          curl -sf http://localhost:4173 || (echo "client preview did not become healthy in time" && exit 1)

      - name: Run E2E suite
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Manual-only (workflow_dispatch) — a safe, read-only-by-design subset run
  # against a real deployed URL with no DATABASE_URL/JWT_SECRET set. Every
  # DB-dependent test self-skips (see tests/support/db.js), so this can never
  # accidentally hit production with a destructive or secret-requiring check —
  # confirmed locally: 14/56 tests run this way, all read-only/auth-gate checks.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.smoke_target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke subset against ${{ github.event.inputs.smoke_target }}
        run: npm run smoke
