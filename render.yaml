services:
  - type: web
    name: varc-trainer-api
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    disk:
      name: varc-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/varc.db
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
